# Despliegue de Inventario POS: la app y PostgreSQL. Ver docs/despliegue.md.
#   cp .env.example .env   # y cambiar las claves
#   docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inventario}
      POSTGRES_USER: ${DB_USER:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      # Logo e íconos del negocio (opcional, ver docs/despliegue.md): la carpeta brand/ junto a este archivo.
      BRAND_DIR: /app/brand
    volumes:
      - ./brand:/app/brand:ro
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
